; =============================================================================
; SmartHome Voice Assistant – firmware
;
; Cấu trúc:
;   [common]        cờ build dùng chung cho mọi env (kể cả native)
;   [arduino_libs]  thư viện chạy được trên mọi core Arduino
;   [esp32_base]    thứ riêng của họ ESP32: platform, thư viện, file nguồn riêng
;   [env:<board>]   từng board cụ thể: chỉ chọn board + macro BOARD_xxx
;   [env:native]    chạy unit test trên máy tính (chỉ test lib/core)
;   [local_web]     bản thử không cần server: web điều khiển trong mạng nhà (src/local/)
;
; Thêm MCU mới: tạo [<mcu>_base] (platform, lib_deps riêng, build_src_filter
; trỏ vào src/platform/<mcu>/), rồi [env:<board>] extends nó. Xem CLAUDE.md.
; =============================================================================

[platformio]
default_envs = esp32dev

[common]
build_flags =
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11
build_std = -std=gnu++17
; Thư viện C++ thuần, dùng được cả ở env native (lib/core)
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

[arduino_libs]
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; ---------------------------------------------------------------- ESP32 ----
[esp32_base]
platform = espressif32@7.0.1
framework = arduino
lib_deps =
    ${arduino_libs.lib_deps}
    crankyoldgit/IRremoteESP8266@^2.8.6
    links2004/WebSockets@^2.6.1
    dfrobot/DFRobotDFPlayerMini@^1.0.6
; Chỉ biên dịch phần triển khai riêng của ESP32
build_src_filter =
    +<*>
    -<platform/>
    +<platform/esp32/>
    -<local/>
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_std}
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3
    ; pio test tự thêm -DUNIT_TEST, làm IRremoteESP8266 chuyển sang chế độ test máy tính
    -UUNIT_TEST
board_build.filesystem = littlefs
; App ~1.9MB x2 (giữ chỗ OTA) + 128KB LittleFS. Bảng mặc định 1.3MB đã đầy ~93% vì IRac
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_framework = unity
; Test trên mạch được dùng code trong src/ (main.cpp tự tắt khi PIO_UNIT_TESTING)
test_build_src = yes

[env:esp32dev]
extends = esp32_base
board = esp32dev
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_ESP32_DEVKIT

; ------------------------------------------------------------ local_web ----
; Bản thử khi chưa có server: thay main.cpp bằng src/local/ (cài WiFi qua WiFi riêng,
; rồi điều khiển bằng web http://smarthome.local trong mạng nhà). KHÔNG dùng để phát hành:
; web không có đăng nhập, ai cùng mạng WiFi cũng điều khiển được.
; Chạy: pio run -e esp32dev_local -t upload
[local_web]
build_src_filter =
    -<main.cpp>
    +<local/>

[env:esp32dev_local]
extends = esp32_base
board = esp32dev
build_src_filter =
    ${esp32_base.build_src_filter}
    ${local_web.build_src_filter}
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_ESP32_DEVKIT

; --------------------------------------------------------------- native ----
; Chạy: pio test -e native
[env:native]
platform = native
test_framework = unity
; test_device_* cần phần cứng thật, chỉ chạy bằng: pio test -e esp32dev -f test_device_*
test_ignore = test_device_*
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_std}
    ${common.build_flags}
